[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "swiftscan"
version         = "1.0.0"
description     = "Async TCP port scanner — 50x faster than nmap defaults"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"
authors         = [{ name = "Harsh Agrawal", email = "harshexploits@proton.me" }]
keywords        = [
    "port-scanner", "nmap-alternative", "asyncio", "security",
    "kali-linux", "pentesting", "bug-bounty", "recon",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

# Pure stdlib — zero external dependencies!
dependencies = []

[project.scripts]
swiftscan = "swiftscan.cli:main"

[project.urls]
Homepage   = "https://github.com/harshexploits/swiftscan"
Repository = "https://github.com/harshexploits/swiftscan"
Issues     = "https://github.com/harshexploits/swiftscan/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["swiftscan*"]
